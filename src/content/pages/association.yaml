fr:
  titre: L'association
  texte: |
    Audencia Global Affairs réunit les étudiants d'Audencia qui veulent comprendre les relations internationales et en débattre.

    Nous faisons trois choses : nous **écrivons** des décryptages de l'actualité géopolitique, nous **invitons** des enseignants et des praticiens pour des conférences ouvertes, et nous **simulons** des négociations internationales lors de sessions Model United Nations.

    *Texte de démonstration, à remplacer depuis le CMS.*
en:
  titre: About us
  texte: |
    Audencia Global Affairs brings together Audencia students who want to understand international relations and debate them.

    We do three things: we **write** analysis of geopolitical news, we **invite** academics and practitioners for open talks, and we **simulate** international negotiations in Model United Nations sessions.

