fr:
  titre: Nous rejoindre
  texte: |
    L'association est ouverte à tous les étudiants d'Audencia, quel que soit le programme.

    - **Rédaction** : proposez un sujet, un membre du bureau vous accompagne jusqu'à la publication.
    - **MUN** : participez à une session, puis aidez à en préparer une.
    - **Conférences** : suggérez un intervenant et participez à l'organisation.
en:
  titre: Join us
  texte: |
    The society is open to all Audencia students, whatever their programme.

    - **Writing**: pitch a topic, and a board member will support you through to publication.
    - **MUN**: take part in a session, then help prepare one.
    - **Talks**: suggest a speaker and help with the organisation.
