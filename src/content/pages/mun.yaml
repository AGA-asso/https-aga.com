fr:
  titre: Simulations MUN
  texte: |
    Une session Model United Nations vous place dans le rôle d'un diplomate : vous représentez un État, défendez sa position et négociez une résolution avec les autres délégations.

    Chaque session porte sur un thème précis et un comité. Aucune expérience n'est requise pour les sessions débutant : le guide d'étude et les règles de procédure sont fournis avant la séance.
en:
  titre: Model UN simulations
  texte: |
    A Model United Nations session puts you in a diplomat's seat: you represent a state, defend its position and negotiate a resolution with the other delegations.

    Each session covers a specific topic and committee. No experience is needed for beginner sessions: the study guide and rules of procedure are provided beforehand.
